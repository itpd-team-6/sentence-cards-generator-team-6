name: Task
description: One unit of work that one pull request closes.
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What the work is. Give the issue a short imperative title, such as `Hold a slot while the client pays`."
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: "Optional. A bullet list with one item for each story issue this task works toward, with the story's AC-nn in parentheses. Leave it empty when the task is not work on a story, such as a workflow or a report."
      placeholder: "- #42 (AC-01, AC-02)"
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "One link per line to each FR-nnn or ADR-nnn on main that this task works on, such as https://github.com/itpd-team-6/sentence-cards-generator-team-6/blob/main/docs/functional-requirements/fr/FR-001.md. A task that serves none says so in one line, such as `None: repository upkeep`."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "A checklist, one item per criterion, each observable and pass/fail. The reviewer ticks every box before approving the pull request."
      value: "- [ ] AC-01: "
    validations:
      required: true

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">System context diagram</title>
  <desc id="d">The learner exchanges texts, word marks, edits and answers for sentences, translations and a study queue with the Sentence cards generator, which exchanges words and sentences with a language model service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933">
    <rect x="318" y="60" width="264" height="220" rx="10" fill="#f3f6f9" stroke="#1f2933" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="450" y="82" text-anchor="middle" font-size="12" fill="#52606d">Product boundary</text>
    <rect x="335" y="110" width="230" height="120" rx="8" fill="#e1ecf4" stroke="#1f2933" stroke-width="2"/>
    <text x="450" y="162" text-anchor="middle" font-weight="bold" font-size="16">Sentence cards</text>
    <text x="450" y="184" text-anchor="middle" font-weight="bold" font-size="16">generator</text>

    <rect x="20" y="125" width="160" height="90" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
    <text x="100" y="165" text-anchor="middle" font-weight="bold" font-size="16">Learner</text>
    <text x="100" y="187" text-anchor="middle" font-size="12" fill="#52606d">actor</text>

    <rect x="720" y="125" width="160" height="90" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
    <text x="800" y="158" text-anchor="middle" font-weight="bold" font-size="16">Language model</text>
    <text x="800" y="180" text-anchor="middle" font-weight="bold" font-size="16">service</text>
    <text x="800" y="200" text-anchor="middle" font-size="12" fill="#52606d">external system</text>

    <line x1="182" y1="145" x2="333" y2="145" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="250" y="124" text-anchor="middle" font-size="12">texts, word marks,</text>
    <text x="250" y="139" text-anchor="middle" font-size="12">edits, answers</text>
    <line x1="333" y1="200" x2="182" y2="200" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="250" y="222" text-anchor="middle" font-size="12">sentences, translations,</text>
    <text x="250" y="237" text-anchor="middle" font-size="12">study queue</text>

    <line x1="567" y1="145" x2="718" y2="145" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="650" y="124" text-anchor="middle" font-size="12">word and request</text>
    <text x="650" y="139" text-anchor="middle" font-size="12">for a sentence</text>
    <line x1="718" y1="200" x2="567" y2="200" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="650" y="222" text-anchor="middle" font-size="12">sentence and</text>
    <text x="650" y="237" text-anchor="middle" font-size="12">translation</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Container view</title>
  <desc id="d">The frontend, a React application, sends requests to the backend, a FastAPI application, and receives answers. The backend reads and writes the database, an SQLite file, with SQL. The backend sends a word and its text to a language model service over HTTPS and receives a sentence, a translation and a phrase. A dashed arrow, decided and not built yet, shows the frontend sending a word and its text to the same service with the key of the user and receiving the sentence, the translation and the phrase.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933">
    <rect x="20" y="110" width="170" height="90" rx="8" fill="#e1ecf4" stroke="#1f2933" stroke-width="2"/>
    <text x="105" y="152" text-anchor="middle" font-weight="bold" font-size="16">frontend (React)</text>
    <text x="105" y="176" text-anchor="middle" font-size="12" fill="#52606d">container</text>

    <rect x="365" y="110" width="170" height="90" rx="8" fill="#e1ecf4" stroke="#1f2933" stroke-width="2"/>
    <text x="450" y="152" text-anchor="middle" font-weight="bold" font-size="16">backend (FastAPI)</text>
    <text x="450" y="176" text-anchor="middle" font-size="12" fill="#52606d">container</text>

    <rect x="710" y="110" width="170" height="90" rx="8" fill="#e1ecf4" stroke="#1f2933" stroke-width="2"/>
    <text x="795" y="152" text-anchor="middle" font-weight="bold" font-size="16">database (SQLite)</text>
    <text x="795" y="176" text-anchor="middle" font-size="12" fill="#52606d">container</text>

    <line x1="192" y1="130" x2="363" y2="130" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="277" y="92" text-anchor="middle" font-size="12">HTTP requests: texts,</text>
    <text x="277" y="107" text-anchor="middle" font-size="12">marks, edits, answers</text>
    <line x1="363" y1="180" x2="192" y2="180" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="277" y="202" text-anchor="middle" font-size="12">HTTP answers: cards,</text>
    <text x="277" y="217" text-anchor="middle" font-size="12">study queue</text>

    <line x1="537" y1="130" x2="708" y2="130" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="622" y="92" text-anchor="middle" font-size="12">SQL statements:</text>
    <text x="622" y="107" text-anchor="middle" font-size="12">reads and writes</text>
    <line x1="708" y1="180" x2="537" y2="180" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="622" y="202" text-anchor="middle" font-size="12">SQL results: rows</text>

    <rect x="335" y="300" width="230" height="80" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="450" y="333" text-anchor="middle" font-weight="bold" font-size="16">Language model service</text>
    <text x="450" y="355" text-anchor="middle" font-size="12" fill="#52606d">external system</text>

    <line x1="410" y1="202" x2="410" y2="298" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="402" y="245" text-anchor="end" font-size="12">HTTPS request:</text>
    <text x="402" y="260" text-anchor="end" font-size="12">word and its text</text>
    <line x1="490" y1="298" x2="490" y2="202" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="498" y="238" text-anchor="start" font-size="12">HTTPS answer: sentence,</text>
    <text x="498" y="253" text-anchor="start" font-size="12">translation, phrase</text>

    <polyline points="140,202 140,335 333,335" fill="none" stroke="#1f2933" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <text x="150" y="285" font-size="12">HTTPS request: word, text</text>
    <text x="150" y="300" font-size="12">and the user's own key</text>
    <polyline points="333,362 50,362 50,202" fill="none" stroke="#1f2933" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <text x="60" y="382" font-size="12">HTTPS answer: sentence, translation, phrase</text>
    <text x="20" y="430" font-size="12" fill="#52606d">Dashed arrows: decided in ADR-004, not built yet.</text>
  </g>
</svg>
